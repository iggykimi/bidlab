[project]
name = "bidlab-api"
version = "0.1.0"
description = "BidLab FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "uvicorn>=0.32",
  "pypdf>=5",
  "jinja2>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.20",
  "pymupdf>=1.24,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bidlab"]
