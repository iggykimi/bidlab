components:
  schemas:
    EntityId:
      type: string
      pattern: ^[A-Za-z0-9_-]{1,80}$
      description: Opaque entity identifier (tender, scope, document, company, scenario,
        report, job).
    Decimal:
      type: string
      pattern: ^-?\d{1,12}(\.\d{1,12})?$
      description: Base-10 decimal string; no locale separators, NaN or Infinity.
    Money:
      type: string
      pattern: ^\d{1,12}\.\d{2}$
      description: Nonnegative EUR net amount with two decimal places; positivity
        is a domain precondition.
    ErrorCode:
      type: string
      enum:
      - arity
      - ast_template_mismatch
      - awarded_negative
      - bad_format
      - bad_kind
      - bad_node
      - bad_request
      - bad_shape
      - bad_type
      - base_not_positive
      - basis_not_approved
      - bool_forbidden
      - budget_exhausted
      - budget_not_positive
      - ceiling_exceeded
      - company_not_found
      - company_profile_corrupt
      - company_scope_mismatch
      - company_without_revision
      - compare_invalid_request
      - conflict
      - const_bad_type
      - const_float_forbidden
      - const_non_finite
      - const_too_large
      - cost_negative
      - curve_out_of_scope
      - cycle
      - demo_seed_incomplete
      - discount_out_of_range
      - discount_out_of_scope
      - document_bytes_unavailable
      - document_duplicate
      - document_not_found
      - document_wrong_tender
      - domain_non_finite
      - domain_validation
      - eligibility_unserializable
      - empty_offer_set
      - extra_forbidden
      - float_forbidden
      - forbidden
      - idempotency_conflict
      - internal
      - interpretation_not_found
      - job_not_found
      - job_running
      - log_non_positive
      - margin_out_of_range
      - max_depth
      - max_points_not_positive
      - method_not_allowed
      - missing_variable
      - money_unparseable
      - non_finite
      - not_found
      - not_positive
      - nothing_to_review
      - offer_not_positive
      - page_not_found
      - pdf_no_pages
      - pdf_page_unreadable
      - pdf_too_large
      - pdf_too_many_pages
      - pdf_unreadable
      - period_mismatch
      - price_not_positive
      - provider_failure
      - provider_not_configured
      - rate_limited
      - reference_not_positive
      - remote_processing_not_allowed
      - report_corrupt
      - report_html_missing
      - report_not_found
      - requirements_tree_corrupt
      - requirements_tree_too_deep
      - revision_conflict
      - rule_malformed
      - rule_not_approved
      - rule_not_found
      - scenario_not_found
      - scenario_snapshot_incomplete
      - scope_not_found
      - scope_tender_mismatch
      - scope_without_budget
      - snapshot_corrupt
      - stale_revision
      - stress_constraints_invalid
      - stress_cost_invalid
      - stress_not_found
      - tender_not_found
      - too_many_nodes
      - too_many_ops
      - too_many_rivals
      - unknown_claim_key
      - unknown_op
      - unknown_template
      - unknown_variable
      - unknown_variant
      - unsupported_media
      - upload_not_pdf
      - upload_too_large
      - validation_error
      description: Machine-readable failure code; the frontend maps known codes to
        Spanish copy.
    Error:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          maxLength: 2000
        request_id:
          type: string
          maxLength: 80
        details:
          type: array
          items:
            type: string
            maxLength: 2000
          minItems: 0
          maxItems: 30
      required:
      - code
      - message
      - request_id
      - details
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
        engine_version:
          type: string
          maxLength: 80
        schema_version:
          type: string
          maxLength: 40
      required:
      - status
      - engine_version
      - schema_version
      additionalProperties: false
    Ready:
      type: object
      properties:
        status:
          type: string
          enum:
          - ready
          - degraded
        db_quick_check:
          type: string
          maxLength: 80
      required:
      - status
      - db_quick_check
      additionalProperties: false
    Capabilities:
      type: object
      properties:
        mode:
          type: string
          enum:
          - demo
          - live
          - manual
        meta_configured:
          type: boolean
        meta_model:
          type: string
          maxLength: 80
        history_enabled:
          type: boolean
        limits:
          type: object
          properties:
            pdf_bytes:
              type: integer
              minimum: 1
            pdf_pages:
              type: integer
              minimum: 1
            curve_points:
              type: integer
              minimum: 1
          required:
          - pdf_bytes
          - pdf_pages
          - curve_points
          additionalProperties: false
        limitations:
          type: array
          items:
            type: string
            maxLength: 2000
          minItems: 0
          maxItems: 20
      required:
      - mode
      - meta_configured
      - meta_model
      - history_enabled
      - limits
      - limitations
      additionalProperties: false
    MetadataEvidence:
      type: object
      properties:
        key:
          type: string
          maxLength: 80
        source_url:
          type: string
          maxLength: 3000
        snapshot_sha256:
          type: string
          maxLength: 64
        field_path:
          type: string
          maxLength: 1000
        raw_value:
          type: string
          maxLength: 2000
        source_updated_at:
          type: string
          maxLength: 80
      required:
      - key
      - source_url
      - snapshot_sha256
      - field_path
      - raw_value
      - source_updated_at
      additionalProperties: false
    PriceBasis:
      type: object
      properties:
        scope_id:
          $ref: '#/components/schemas/EntityId'
        budget_net:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        ceiling_net:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        scoring_reference_net:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        reference_kind:
          type: string
          enum:
          - pbl
          - vec
          - custom
          - unknown
        currency:
          type: string
          enum:
          - EUR
        unit:
          type: string
          enum:
          - lump_sum
          - unit_price
          - percentage
          - framework_cap
          - unknown
        period_months:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        tax_kind:
          type: string
          enum:
          - VAT
          - IGIC
          - other
          - unknown
        review_status:
          type: string
          enum:
          - pending
          - approved
          - blocked
        evidence_ids:
          type: array
          items:
            $ref: '#/components/schemas/EntityId'
          minItems: 0
          maxItems: 20
        metadata_evidence:
          type: array
          items:
            $ref: '#/components/schemas/MetadataEvidence'
          minItems: 0
          maxItems: 20
      required:
      - scope_id
      - budget_net
      - ceiling_net
      - scoring_reference_net
      - reference_kind
      - currency
      - unit
      - period_months
      - tax_kind
      - review_status
      - evidence_ids
      - metadata_evidence
      additionalProperties: false
    Scope:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        tender_id:
          $ref: '#/components/schemas/EntityId'
        lot_id:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
        label:
          type: string
          maxLength: 300
        basis:
          $ref: '#/components/schemas/PriceBasis'
      required:
      - id
      - tender_id
      - lot_id
      - label
      - basis
      additionalProperties: false
    Tender:
      type: object
      properties:
        raw_snapshot_sha256:
          type: string
          maxLength: 64
        metadata_evidence:
          type: array
          items:
            $ref: '#/components/schemas/MetadataEvidence'
          minItems: 0
          maxItems: 30
        id:
          $ref: '#/components/schemas/EntityId'
        source_id:
          type: string
          maxLength: 1000
        source_url:
          type: string
          maxLength: 3000
        external_id:
          type: string
          maxLength: 200
        title:
          type: string
          maxLength: 2000
        contracting_body:
          type: string
          maxLength: 1000
        cpv_codes:
          type: array
          items:
            type: string
            maxLength: 12
          minItems: 0
          maxItems: 30
        status_raw:
          type: string
          maxLength: 40
        source_updated_at:
          type: string
          maxLength: 80
        deadline_literal:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
        deadline_at:
          anyOf:
