openapi: 3.1.0
info:
  title: BidLab local API
  version: 1.0.0
  description: Design contract, not a deployed API. Decimal values are strings. Rules
    must be reviewed. Loopback only; mutations require same-origin validation and
    X-BidLab-Client.
servers:
- url: http://127.0.0.1:8000
paths:
  /api/v1/health:
    get:
      operationId: health
      summary: Liveness probe
      description: Returns ok with engine/schema versions. Never touches Meta billing
        or the database.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                example:
                  summary: health example
                  value:
                    status: ok
                    engine_version: 1.0.0
                    schema_version: 1.0.0
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      tags:
      - health
  /api/v1/ready:
    get:
      operationId: readiness
      summary: Readiness probe
      description: Liveness plus a SQLite PRAGMA quick_check; reports degraded with
        status 503 when the database is unhealthy.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
              examples:
                example:
                  summary: readiness example
                  value:
                    status: ready
                    db_quick_check: ok
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          description: Database degraded; same Ready shape as the 200 body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
              examples:
                example:
                  summary: readiness example
                  value:
                    status: degraded
                    db_quick_check: integrity check failed
      tags:
      - health
  /api/v1/capabilities:
    get:
      operationId: capabilities
      summary: Effective capabilities
      description: Mode, Meta configuration (never the key), history flag, hard limits
        and limitation notes.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
              examples:
                example:
                  summary: capabilities example
                  value:
                    mode: demo
                    meta_configured: false
                    meta_model: muse-spark-1.3
                    history_enabled: false
                    limits:
                      pdf_bytes: 20971520
                      pdf_pages: 120
                      curve_points: 201
                    limitations:
                    - 'curated_demo: figures come from the reviewed seed, not live
                      extraction'
                    - history_disabled
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      tags:
      - capabilities
  /api/v1/demo/sessions:
    post:
      operationId: create_demo_session
      summary: Create demo session
      description: Ensures the curated seed exists on an empty database and returns
        its tender, scope and company ids. Idempotent via Idempotency-Key.
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoSession'
              examples:
                example:
                  summary: create_demo_session example
                  value:
                    tender_id: tias
                    scope_id: tias-whole
                    company_id: company-demo
                    mode: demo
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      tags:
      - tenders
      parameters:
      - $ref: '#/components/parameters/XBidLabClient'
      - $ref: '#/components/parameters/IdempotencyKey'
  /api/v1/tenders:
    get:
      operationId: list_tenders
      summary: List tenders
      description: Curated library search with q/cpv filters and page/page_size pagination.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenderList'
