  /api/v1/tenders/{tender_id}/documents:
    post:
      operationId: upload_tender_document
      summary: Upload tender document
      description: Attach a user-supplied local PDF to an own tender. Validates magic
        bytes, size and readability before storing; failures keep the tender intact.
        Idempotent via Idempotency-Key over the file bytes plus kind.
      tags:
      - documents
      parameters:
      - name: tender_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EntityId'
        example: tias
      - $ref: '#/components/parameters/XBidLabClient'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF bytes; type, size and limits are validated server-side.
                kind:
                  type: string
                  enum:
                  - pcap
                  - ppt
                  - other
                  default: other
                  description: Document kind; defaults to other.
              required:
              - file
              additionalProperties: false
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              examples:
                example:
                  summary: upload_tender_document example
                  value:
                    id: doc-upload-001
                    tender_id: tias
                    kind: other
                    display_name: pliego.pdf
                    sha256: 9f2c4a1e9f2c4a1e9f2c4a1e9f2c4a1e9f2c4a1e9f2c4a1e9f2c4a1e9f2c4a1e
