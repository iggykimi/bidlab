  /api/v1/tenders/{tender_id}/analysis:
    post:
      operationId: start_analysis
      summary: Start analysis job
      description: Queue extraction over curated pages; poll with get_job. The Location
        header points at the job resource.
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                example:
                  summary: start_analysis example
                  value:
                    id: job-20261026-001
                    tender_id: tias
                    status: succeeded
                    stage: done
                    processed_pages: 6
                    total_pages: 6
                    result_revision: 2
                    error_code: null
                    warnings: []
                    invocation_id: inv-job-20261026-001-a1
                    mode: fixture
                    model: null
                    prompt_tokens: null
                    completion_tokens: null
                    estimated_cost_usd: null
                    provider_request_id: null
                    latency_ms: null
          headers:
