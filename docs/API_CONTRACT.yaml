                example:
                  summary: list_tenders example
                  value:
                    items:
                    - raw_snapshot_sha256: 9f2c4a1e9f2c4a1e9f2c4a1e9f2c4a1e9f2c4a1e9f2c4a1e9f2c4a1e9f2c4a1e
                      metadata_evidence: []
                      id: tias
                      source_id: placsp:2026/00006554N
                      source_url: https://contrataciondelestado.es/wps/portal/!ut/p/b0/
                      external_id: 2026/00006554N
                      title: Servicio de limpieza (Tias, ejemplo curado)
                      contracting_body: Ayuntamiento de Tias
                      cpv_codes:
                      - '79411000'
                      status_raw: ADJ
                      source_updated_at: '2026-01-01T00:00:00Z'
                      deadline_literal: null
                      deadline_at: null
                      pbl_net: '118336.00'
                      pbl_gross: '126619.52'
                      estimated_value: '295840.00'
                      scopes: []
                      quality_flags: []
                    page: 1
                    page_size: 20
                    total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      tags:
      - tenders
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
        example: Tias
      - name: cpv
        in: query
        required: false
        schema:
          type: string
          maxLength: 12
        example: '79411000'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
    post:
      operationId: create_tender
      summary: Create own tender
      description: 'Manual intake: creates an own tender with an initial scope from
        the supplied fields only. Never fetches remote data and never infers tax from
        a single amount. Idempotent via Idempotency-Key.'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tender'
              examples:
                example:
                  summary: create_tender example
                  value:
                    raw_snapshot_sha256: 9f2c4a1e9f2c4a1e9f2c4a1e9f2c4a1e9f2c4a1e9f2c4a1e9f2c4a1e9f2c4a1e
